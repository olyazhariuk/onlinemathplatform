<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Особистий кабінет</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
      color: #1e293b;
    }

    header {
      background-color: #1e3a8a;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin: 0 1rem;
      font-weight: 600;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .lang-toggle {
      background-color: white;
      color: #1e3a8a;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      color: #1e40af;
    }

    .section {
      background: #ffffff;
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 2rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
    }

    .course {
      margin-bottom: 1.5rem;
    }

    .course-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      background-color: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      height: 20px;
    }

    .progress-fill {
      background-color: #3b82f6;
      height: 100%;
      width: 0%;
      text-align: right;
      padding-right: 0.5rem;
      color: white;
      line-height: 20px;
      font-size: 0.9rem;
      transition: width 0.5s ease;
    }

    ul {
      padding-left: 1.2rem;
      list-style-type: disc;
    }

    @media (max-width: 600px) {
      .progress-fill {
        font-size: 0.75rem;
        padding-right: 0.3rem;
      }
      .nav-links {
        text-align: center;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-links">
      <a href="index.html" id="link-home">Головна</a>
      <a href="catalog.html" id="link-catalog">Каталог курсів</a>
    </div>
    <button class="lang-toggle" onclick="toggleLanguage()">EN</button>
  </header>

  <div class="container">
    <h1 id="greeting">Особистий кабінет</h1>

    <div class="section">
      <h2 id="your-courses">Ваші курси</h2>

      <div class="course">
        <div class="course-title" id="course1">Прикладна математика</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 75%;">75%</div>
        </div>
      </div>

      <div class="course">
        <div class="course-title" id="course2">Статистика</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 50%;">50%</div>
        </div>
      </div>

      <div class="course">
        <div class="course-title" id="course3">Чисельні методи</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 90%;">90%</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2 id="recommended">Рекомендовані курси</h2>
      <ul id="recommendation-list">
        <li>Математичне моделювання</li>
        <li>Основи Python для математиків</li>
        <li>Фінансова математика</li>
      </ul>
    </div>
  </div>

  <script>
    let isUkrainian = true;

    const texts = {
      ua: {
        greeting: "Особистий кабінет",
        yourCourses: "Ваші курси",
        recommended: "Рекомендовані курси",
        linkHome: "Головна",
        linkCatalog: "Каталог курсів",
        courses: ["Прикладна математика", "Статистика", "Чисельні методи"],
        recs: [
          "Математичне моделювання",
          "Основи Python для математиків",
          "Фінансова математика"
        ],
        langBtn: "EN"
      },
      en: {
        greeting: "Profile",
        yourCourses: "Your Courses",
        recommended: "Recommended Courses",
        linkHome: "Home",
        linkCatalog: "Course Catalog",
        courses: ["Applied Mathematics", "Statistics", "Numerical Methods"],
        recs: [
          "Mathematical Modeling",
          "Python Basics for Mathematicians",
          "Financial Mathematics"
        ],
        langBtn: "UA"
      }
    };

    function toggleLanguage() {
      isUkrainian = !isUkrainian;
      const lang = isUkrainian ? "ua" : "en";
      const t = texts[lang];

      document.getElementById("greeting").innerText = t.greeting;
      document.getElementById("your-courses").innerText = t.yourCourses;
      document.getElementById("recommended").innerText = t.recommended;

      document.getElementById("course1").innerText = t.courses[0];
      document.getElementById("course2").innerText = t.courses[1];
      document.getElementById("course3").innerText = t.courses[2];

      document.getElementById("recommendation-list").innerHTML =
        t.recs.map(r => `<li>${r}</li>`).join("");

      document.getElementById("link-home").innerText = t.linkHome;
      document.getElementById("link-catalog").innerText = t.linkCatalog;
      document.querySelector(".lang-toggle").innerText = t.langBtn;
    }
  </script>
</body>
</html>
