<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathLearn</title>
  <style>
    :root {
      --main-color: #1e3a8a;
      --accent-color: #3b82f6;
      --bg-color: #f1f5f9;
      --text-color: #1f2937;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--main-color);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .lang-toggle {
      background-color: white;
      color: var(--main-color);
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 1rem auto;
    }

    .buttons {
      margin-top: 2rem;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      padding: 0.8rem 1.6rem;
      margin: 0.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .btn {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" id="site-name">MathLearn</div>
    <button class="lang-toggle" onclick="toggleLanguage()">EN</button>
  </header>

  <main>
    <h1 id="main-heading">Ласкаво просимо на платформу MathLearn!</h1>
    <p id="description">
      Онлайн-сервіс для вивчення прикладної математики з інтерактивними курсами, відеоуроками, тестами та AI-репетитором.
    </p>
    <div class="buttons">
      <a href="login.html" class="btn" id="start-btn">Почати навчання</a>
      <a href="course.html" class="btn" id="about-btn">Про нас</a>
      <a href="profile.html" class="btn" id="profile-btn">Особистий кабінет</a>
      <a href="contacts.html" class="btn" id="contacts-btn">Контакти</a>
    </div>
  </main>

  <script>
    let isUkrainian = true;

    const texts = {
      ua: {
        name: "MathLearn",
        heading: "Ласкаво просимо на платформу MathLearn!",
        desc: "Онлайн-сервіс для вивчення прикладної математики з інтерактивними курсами, відеоуроками, тестами та AI-репетитором.",
        start: "Почати навчання",
        about: "Про нас",
        profile: "Особистий кабінет",
        contacts: "Контакти",
        langBtn: "EN"
      },
      en: {
        name: "MathLearn",
        heading: "Welcome to MathLearn!",
        desc: "An online service for learning applied mathematics with interactive courses, video lessons, tests, and an AI tutor.",
        start: "Start Learning",
        about: "About Us",
        profile: "Profile",
        contacts: "Contacts",
        langBtn: "UA"
      }
    };

    function toggleLanguage() {
      isUkrainian = !isUkrainian;
      const lang = isUkrainian ? "ua" : "en";
      document.getElementById("site-name").innerText = texts[lang].name;
      document.getElementById("main-heading").innerText = texts[lang].heading;
      document.getElementById("description").innerText = texts[lang].desc;
      document.getElementById("start-btn").innerText = texts[lang].start;
      document.getElementById("about-btn").innerText = texts[lang].about;
      document.getElementById("profile-btn").innerText = texts[lang].profile;
      document.getElementById("contacts-btn").innerText = texts[lang].contacts;
      document.querySelector(".lang-toggle").innerText = texts[lang].langBtn;
    }
  </script>
</body>
</html>
